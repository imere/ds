    <h1 class="ds-text-2xl ds-font-bold ds-mb-4">ds-foundation · UMD 直引</h1>

    <div class="ds-flex ds-gap-2 ds-mb-4" style="flex-wrap: wrap">
      <button type="button" id="btn-light" class="ds-p-2 ds-rounded-md ds-border ds-border-solid ds-cursor-pointer ds-bg-brand">
        浅色
      </button>
      <button type="button" id="btn-dark" class="ds-p-2 ds-rounded-md ds-border ds-border-solid ds-cursor-pointer ds-bg-brand">
        深色
      </button>
      <button type="button" id="btn-toggle" class="ds-p-2 ds-rounded-md ds-border ds-border-solid ds-cursor-pointer">
        切换明暗
      </button>
      <select id="sel-accent" class="ds-p-2 ds-rounded-md ds-border ds-border-solid">
        <option value="indigo">靛蓝</option>
        <option value="blue">天蓝</option>
        <option value="green">青绿</option>
        <option value="orange">暖橙</option>
      </select>
      <button type="button" id="btn-custom" class="ds-p-2 ds-rounded-md ds-border ds-border-solid ds-cursor-pointer">
        覆盖圆角
      </button>
    </div>

    <div id="info" class="demo-box ds-p-4 ds-rounded-md ds-bg-subtle ds-mb-4">初始化中…</div>

    <div class="ds-flex ds-gap-4" style="flex-wrap: wrap">
      <div class="demo-box ds-p-4 ds-rounded-md ds-bg-subtle" style="flex: 1 1 220px">
        <div class="ds-font-semibold ds-mb-2">semantic class</div>
        <div class="ds-text-muted">.ds-text-muted —— 随主题变</div>
        <!--
          注意这块没有写 style="background: var(--ds-color-brand)"。
          那样写在 IE10 上会整条声明失效、色块变成透明。
          正确姿势是用 ds.style() 让引擎按通道返回该给的东西：
            vars 通道 -> var(--ds-color-brand)
            static 通道 -> #4f46e5（真实值）
        -->
        <div id="brand-box" class="ds-mt-2 ds-p-2 ds-rounded-sm">品牌色块</div>
      </div>

      <div class="demo-box ds-p-4 ds-rounded-md ds-bg-subtle" style="flex: 1 1 220px">
        <div class="ds-font-semibold ds-mb-2">primitive class</div>
        <div class="ds-text-muted">.ds-p-4 / .ds-rounded-md / .ds-flex</div>
        <div class="ds-mt-2 ds-text-muted">主题无关，只生成一份</div>
      </div>
    </div>

    <script>
      ;(function () {
        // 通道自动选择：支持 CSS 变量 -> vars；IE10/IE11 -> static
        var ds = DsDom.createThemeManager({
          channel: 'auto',
          persist: true,
          followSystem: true,
          theme: null,
        })
        ds.init()

        function $(id) {
          return document.getElementById(id)
        }

        function render() {
          var s = ds.state()
          var html = ''
          html += '<b>通道</b>：' + s.channel
          html += ' ｜ <b>主题</b>：' + s.theme + '（' + s.mode + '）'
          html += ' ｜ <b>强调色</b>：' + (s.accent || '未选')
          html += ' ｜ <b>令牌数</b>：' + Object.keys(ds.tokens()).length
          html += '<br /><b>color-brand</b> = ' + ds.get('color-brand')
          html += ' ｜ <b>color-bg</b> = ' + ds.get('color-bg')
          html += ' ｜ <b>radius-md</b> = ' + ds.get('radius-md')
          $('info').innerHTML = html

          // 按通道返回合适的写法：vars 通道给 var()，static 通道给实值
          var box = $('brand-box')
          var st = ds.style({ 'background-color': 'color-brand', color: 'on-brand' })
          for (var k in st) {
            if (Object.prototype.hasOwnProperty.call(st, k)) box.style[k] = st[k]
          }
        }

        function on(id, ev, fn) {
          var el = $(id)
          if (el.addEventListener) el.addEventListener(ev, fn, false)
          else el.attachEvent('on' + ev, fn)
        }

        on('btn-light', 'click', function () {
          ds.use('light')
        })
        on('btn-dark', 'click', function () {
          ds.use('dark')
        })
        on('btn-toggle', 'click', function () {
          ds.toggle()
        })
        on('sel-accent', 'change', function () {
          ds.useAccent(this.value)
        })
        on('btn-custom', 'click', function () {
          // 分层覆盖：分组名 + 驼峰键，或扁平键都可以
          ds.override('radius', { md: '16px', lg: '24px' })
        })

        ds.subscribe(render)
        render()
      })()
    </script>
  </body>
</html>
