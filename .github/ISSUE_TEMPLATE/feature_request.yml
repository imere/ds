name: 需求
description: 建议一个新能力，或对现有设计决策提出质疑
title: 'feat: '
labels: [enhancement]
body:
  - type: markdown
    value: |
      本库有一条硬边界，提需求前先看一眼，能省掉一轮来回：

      - **机制归 `@ds/core`，值归 `@ds/tokens`。** 想要一个新色值 / 新断点 / 新尺度，
        那是 `@ds/tokens` 的事（或者你自己那份 tokens）；想要一种新的算法，才是 core 的事。
      - **库不自带设计决策。** 「不给的时候给个默认值」这种需求基本都会被拒 ——
        早期那个「accent 为空就套 indigo」的兜底，代价是所有主题品牌色一样，而且看不出来。

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 写场景，别写方案。「我需要 X 因为现在做不到 Y」
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 应该落在哪一层
      options:
        - '@ds/core（算法 / 机制）'
        - '@ds/tokens（值 / 设计决策）'
        - '@ds/dom（运行时注入）'
        - '@ds/vue2（框架绑定）'
        - 工程化（构建 / 测试 / CI / 文档）
        - 我判断不了
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的 API
      description: 有就写，没有就空着。写成调用代码比写成文字清楚
      placeholder: |
        ```js
        deriveTokens(seed, [], 'light', { /* 新增选项 */ })
        ```
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 有没有不用改库就能解决的办法
      description: |
        这条最重要。本库的可配置项很多（algorithm 管道、覆盖链、UnitSpace 系数表、
        semantic map），大部分诉求其实不用动源码。
    validations:
      required: false

  - type: checkboxes
    id: compat
    attributes:
      label: IE10 约束
      options:
        - label: 这个需求不需要新增运行时 API（`Object.assign` / `Set` / `Map` / `Promise` 等一律不可用）
        - label: 如果不确定，勾「不确定」并在上面写明
        - label: 不确定（我不清楚会不会引入新 API）
