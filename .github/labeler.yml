# 按改动路径自动打标签（配合 .github/workflows/labeler.yml）。
# 粒度按「包」而不是按「文件类型」—— 这个仓库的问题从来都是「哪一层错了」，
# 不是「这是 .ts 还是 .md」。
core:
  - changed-files:
      - any-glob-to-any-file: packages/core/**

tokens:
  - changed-files:
      - any-glob-to-any-file: packages/tokens/**

dom:
  - changed-files:
      - any-glob-to-any-file: packages/dom/**

vue2:
  - changed-files:
      - any-glob-to-any-file: packages/vue2/**

unit:
  - changed-files:
      - any-glob-to-any-file: packages/core/src/unit.ts

convert:
  - changed-files:
      - any-glob-to-any-file: packages/core/src/convert.ts

ie10:
  - changed-files:
      - any-glob-to-any-file:
          - swc.config.js
          - eslint.config.js
          - tests/es5.test.ts

tests:
  - changed-files:
      - any-glob-to-any-file: tests/**

examples:
  - changed-files:
      - any-glob-to-any-file: examples/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - README.md
          - packages/*/README.md
          - '**/*.md'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - rollup.config.js
          - vitest.config.ts
          - tsconfig*.json

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - packages/*/package.json
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
