# 代码扫描。JS/TS 场景 CodeQL 能抓的多是「污点从哪流到哪」这类问题，
# 对本库（纯函数 + 字符串拼 CSS）命中率不高，但它是免费的常驻哨兵，
# 而且开了之后 GitHub 的安全概览页才有数据。
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # 每周一 03:17 UTC。避开整点：GitHub 的定时任务在整点会排队。
    - cron: '17 3 * * 1'

# 刻意不挂 pull_request：PR 里带过来的 token 是只读的（Dependabot 与 fork 出来的
# 外部 PR 都是），写不了 security-events，analyze 那一步必红。
# 主干上跑 + 每周扫一遍已经够用。
permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Code scanning 要 GitHub Advanced Security。本仓库是公开的，GHAS 对公开仓库
    # 免费，所以默认跑；fork 出去的副本通常没开，那种环境里在 Settings → Variables
    # 加 ENABLE_GHAS = false 就跳过，不用回来改文件。
    if: vars.ENABLE_GHAS != 'false'
    permissions:
      contents: read
      # 上传扫描结果必须要
      security-events: write
      # 这一条不加会红：显式声明 permissions 会把没写到的全部置为 none，
      # 而 codeql-action 要 GET 一次 workflow run 元信息，缺 actions: read 就报
      # "Resource not accessible by integration"。
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          # 库本体只占仓库的一半，另一半是示例工程；只扫 packages 与 scripts。
          # queries 用默认档：security-and-quality 会刷一堆风格建议，噪音大过收益。
          config-file: .github/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
