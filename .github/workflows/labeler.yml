# 按改动路径自动打标签。省掉每次手工点，也让「这个 PR 动了哪一层」在列表页一眼可见。
# 规则在 .github/labeler.yml，两边改一个都要改另一个。
name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true # 路径改了之后旧标签要撤掉，否则会越积越多
