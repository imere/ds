# PR 里的依赖变更评审：新增依赖若带已知漏洞，或许可证不在允许清单里，直接失败。
# 与 Dependabot 的分工：它管「已经在库里的依赖旧了」，这个管「新引进来的依赖脏」。
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # Dependency Review 需要 GitHub Advanced Security（且依赖图要开）。
    # 本仓库是私有库、没开 GHAS，直接跑会报
    # "Dependency review is not supported on this repository"。
    # 所以默认跳过：哪天开了 GHAS，在仓库 Settings → Variables 里加一个
    # ENABLE_GHAS = true 就自动启用，不用回来改文件。
    if: vars.ENABLE_GHAS == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          # 严重（critical）/ 高危（high）阻断，中低危只评论不拦。
          fail-on-severity: high
          # 本库所有依赖都是 devDependency（四个包都是 private，不发布），
          # 但示例工程会被分发，所以许可证还是要卡：排除 copyleft 强传染的几类。
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure
