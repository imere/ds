# 依赖更新。两条规则：一条管 npm，一条管 GitHub Actions。
# 本仓库四个包都是 private（不发布），所以版本更新的意义不是「升版本」，
# 而是「早点发现新版本会不会把 IE10 产物搞坏」—— 这正是 CI 存在的理由。
version: 2

updates:
  - package-ecosystem: npm
    directory: /ds-foundation
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    # 全部依赖都归到一组：本仓库装了 30 来个 devDependency，
    # 一个包一个 PR 的话每周要处理十几个，没人真会逐个看。
    groups:
      dev-dependencies:
        patterns:
          - '*'
        # 只有 patch / minor 进组；major 单独开 PR，它可能真的改行为。
        update-types:
          - patch
          - minor
    # major 单独走，且不限量，避免出现「永远升不上去」
    labels:
      - dependencies
    # 版本范围只加不改：本仓库刻意锁着几个版本（见下），
    # Dependabot 若自作主张改 range 会绕过那些锁。
    versioning-strategy: increase
    #
    # commit 前缀只写 `chore`，scope 交给 `include: scope` 去补（deps / deps-dev）。
    # 别在 prefix 里再塞一个 `(deps)`：那样拼出来是 `chore(deps-dev)(deps-dev)`，
    # PR Title 那条检查会判成不合法标题（实测 Dependabot 开出来的 PR 全红在这一条上）。
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: scope
    #
    # 刻意锁住的，别动：
    #   vue 3 —— @ds/vue2 的存在意义就是支持 Vue 2，升到 3 整个包失去意义
    #   typescript 7 —— Go 原生版不提供 JS 编译器 API，typescript-eslint 启动即崩
    #     （详见 ds-foundation/README.md「TS 版本锁在 6.0.3，别升 7」）
    ignore:
      - dependency-name: vue
        versions: ['>=3']
      - dependency-name: typescript
        versions: ['>=7']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
    reviewers:
      - imere

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
      include: scope
    labels:
      - dependencies
      - ci
